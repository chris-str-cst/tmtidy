# tmtidy config — full reference: docs/config.md

# Dirs to scan for build-dir markers.
roots:
  - path: ~/code
    max_depth: 6          # descend depth (default 8)
  - path: ~/projects

# Which baked-in rules apply. Omit = all nine
# (rust/node/python/go/swiftpm/gradle/maven/terraform/terragrunt); [] = none.
# defaults: [rust, node]

# Extra rules, merged with baked-in ones (same name overrides).
# A marker file in a dir excludes that dir's `targets` from Time Machine.
rules:
  - name: node
    markers: [package.json]
    targets: [node_modules, .next, dist]

# Decay: move stale excluded build dirs to the Trash (recoverable).
# Opt-in and manual — only runs on `tmtidy decay --clean` (never on scan, never
# scheduled). Omit this whole block to keep the defaults; nothing decays until
# you ask. These keys just tune the thresholds for when you do.
decay:
  max_age_days: 30        # trash only dirs older than this
  min_size_mb: 100        # ...and at least this big
  auto_clean: false       # true = trash without `--clean` (--dry-run still wins)
  exclude_rules: [swiftpm]       # rules decay never trashes (scan still excludes them)
  exclude_paths:                 # paths decay never trashes (scan still excludes them)
    - ~/code/archive
  json_output: ~/.local/state/tmtidy/decay-last.json   # append each run as a JSON line here

# Skipped entirely: not scanned, not excluded, never decayed.
ignore:
  - ~/code/keepme
