[package]
name = "tmtidy"
version = "0.1.0"
edition = "2021"
description = "Keep Time Machine lean by excluding build dirs, with decay-based cleanup"
license = "MIT"
repository = "https://github.com/cst/tmtidy"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
walkdir = "2"
xattr = "1"
trash = "5"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
shellexpand = "3"
dirs = "5"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
xattr = "1"
