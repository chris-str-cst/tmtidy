name: Feature request
description: Suggest a new capability or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks for the idea. Please describe the problem before the solution — it helps find the right fix.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that tmtidy makes hard or impossible today?
      placeholder: I want to exclude … but there's no rule / flag for it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like tmtidy to do? A new rule, flag, config key, subcommand …?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you've tried or other approaches you weighed.
    validations:
      required: false
